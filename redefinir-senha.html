<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Definir nova senha — Abenfo RJ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="assets/logo-abenforj.png">
  <style>
    .campo-senha { position: relative; }
    .campo-senha input { padding-right: 2.75rem; }
    .btn-mostrar-senha {
      position: absolute;
      right: 0.5rem;
      top: 2.05rem;
      width: 2rem;
      height: 2rem;
      background: transparent;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
      color: var(--texto-suave);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    .btn-mostrar-senha:hover { color: var(--texto); background: var(--areia); }
    .btn-mostrar-senha:focus-visible {
      outline: 2px solid var(--verde-escuro);
      outline-offset: 2px;
    }
    .btn-mostrar-senha svg { width: 20px; height: 20px; }
  </style>
</head>
<body>
  <a href="#conteudo" class="skip-link">Pular para o conteúdo</a>

  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="logo-link" aria-label="Abenfo RJ — Página inicial">
        <img src="assets/logo-abenforj.png" alt="Logo Abenfo RJ">
        <div class="logo-text">Abenfo RJ<span>Enfermagem Obstétrica</span></div>
      </a>
    </div>
  </header>

  <main id="conteudo">
    <section class="page-hero">
      <div class="container">
        <h1>Definir nova senha</h1>
        <p>Escolha uma nova senha para acessar a sua conta.</p>
      </div>
    </section>

    <section class="section">
      <div class="container" style="max-width:440px;">
        <div class="card" style="padding:2rem;">
          <div id="def-aviso" hidden></div>

          <form id="def-form" action="javascript:void(0)" novalidate>
            <div class="campo campo-senha">
              <label for="senha">Nova senha</label>
              <input type="password" id="senha" name="senha" autocomplete="new-password" required minlength="8">
              <button type="button" class="btn-mostrar-senha" aria-label="Mostrar senha" aria-pressed="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
              <small style="color:var(--texto-suave);font-size:0.85rem;">Mínimo de 8 caracteres.</small>
            </div>
            <div class="campo campo-senha">
              <label for="senha2">Confirmar nova senha</label>
              <input type="password" id="senha2" name="senha2" autocomplete="new-password" required minlength="8">
              <button type="button" class="btn-mostrar-senha" aria-label="Mostrar senha" aria-pressed="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
            <button type="submit" class="btn btn-solid btn-block" id="btn-def">Salvar nova senha</button>
          </form>
        </div>

        <p style="margin-top:1.25rem;text-align:center;font-size:0.95rem;">
          <a href="login.html">Voltar para entrar</a>
        </p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="copyright" style="border:0;padding:1rem 0;">
        © <span id="ano"></span> Abenfo RJ.
      </div>
    </div>
  </footer>

  <script>document.getElementById('ano').textContent = new Date().getFullYear();</script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/main.js"></script>
  <script>
    (function () {
      var form = document.getElementById('def-form');
      var aviso = document.getElementById('def-aviso');
      var btn = document.getElementById('btn-def');

      // Mostrar/ocultar senha (em todos os campos .campo-senha)
      var ICONE_OLHO_ABERTO = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
      var ICONE_OLHO_FECHADO = '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a19.77 19.77 0 0 1 4.22-5.32"/><path d="M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a19.77 19.77 0 0 1-2.16 3.19"/><path d="M9.88 9.88a3 3 0 0 0 4.24 4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
      document.querySelectorAll('.btn-mostrar-senha').forEach(function (b) {
        var inp = b.closest('.campo-senha').querySelector('input');
        var icone = b.querySelector('svg');
        b.addEventListener('click', function () {
          var visivel = inp.type === 'text';
          inp.type = visivel ? 'password' : 'text';
          icone.innerHTML = visivel ? ICONE_OLHO_ABERTO : ICONE_OLHO_FECHADO;
          b.setAttribute('aria-pressed', visivel ? 'false' : 'true');
          b.setAttribute('aria-label', visivel ? 'Mostrar senha' : 'Ocultar senha');
        });
      });

      function mostrarAviso(texto, tipo) {
        aviso.hidden = false;
        aviso.className = 'aviso';
        aviso.style.background = tipo === 'erro' ? '#fde8e8' : (tipo === 'sucesso' ? '#e6f4ea' : 'var(--aviso-bg)');
        aviso.style.borderLeftColor = tipo === 'erro' ? '#c53030' : (tipo === 'sucesso' ? '#2e7d4f' : 'var(--aviso-borda)');
        aviso.style.color = tipo === 'erro' ? '#742020' : (tipo === 'sucesso' ? '#1f5d3a' : '#5a4a10');
        aviso.innerHTML = texto;
      }

      if (!window.SUPABASE_PRONTO) {
        mostrarAviso('Sistema em configuração. Volte em breve.', 'info');
        btn.disabled = true;
        return;
      }

      var sb = window.abenfo.sb;
      var prontoParaTrocar = false;

      var LINK_NOVO = ' <a href="recuperar-senha.html">Clique aqui para pedir um novo link.</a>';

      function bloquear(htmlErro) {
        form.style.display = 'none';
        mostrarAviso(htmlErro, 'erro');
      }

      // Lê parâmetros tanto da query (?a=b) quanto do hash (#a=b).
      function lerParametros() {
        var out = {};
        try {
          new URLSearchParams(window.location.search).forEach(function (v, k) { out[k] = v; });
          var h = window.location.hash ? window.location.hash.substring(1) : '';
          new URLSearchParams(h).forEach(function (v, k) { out[k] = v; });
        } catch (e) { /* navegador muito antigo */ }
        return out;
      }

      // Espera a sessão aparecer (o fluxo implícito processa o hash de forma assíncrona).
      async function esperarSessao(tentativas) {
        for (var i = 0; i < tentativas; i++) {
          var s = await window.abenfo.auth.sessao();
          if (s) return s;
          await new Promise(function (r) { setTimeout(r, 250); });
        }
        return null;
      }

      async function inicializar() {
        btn.disabled = true;
        btn.textContent = 'Validando link…';

        var p = lerParametros();

        // 1) Link com erro explícito (expirado, já usado, prévia do e-mail queimou o token)
        if (p.error || p.error_code) {
          var expirou = p.error_code === 'otp_expired' || /expired|invalid/i.test(p.error_description || '');
          bloquear(
            (expirou
              ? '<strong>Este link expirou ou já foi usado.</strong> Os links de redefinição valem por 1 hora e funcionam só uma vez.'
              : '<strong>Não foi possível validar o link.</strong>') + LINK_NOVO
          );
          return;
        }

        try {
          // 2) Formato novo: token_hash na URL → validamos aqui (prévia de e-mail não consome)
          if (p.token_hash && p.type) {
            var rv = await sb.auth.verifyOtp({ type: p.type, token_hash: p.token_hash });
            if (rv.error) throw rv.error;
          } else if (p.code) {
            // 3) Formato PKCE (?code=) — troca o code por sessão
            var rc = await sb.auth.exchangeCodeForSession(p.code);
            if (rc.error) throw rc.error;
          }
          // 4) Formato implícito (#access_token=...): detectSessionInUrl já cuida — só esperamos.
        } catch (err) {
          bloquear('<strong>Não foi possível validar o link.</strong> Ele pode ter expirado ou já ter sido aberto antes.' + LINK_NOVO);
          return;
        }

        var sess = await esperarSessao(12); // ~3s
        if (!sess) {
          bloquear('<strong>Link inválido ou expirado.</strong> Abra o link mais recente do seu e-mail.' + LINK_NOVO);
          return;
        }

        // Limpa o token da URL para não reprocessar/vazar ao recarregar.
        try { history.replaceState(null, '', window.location.pathname); } catch (e) { /* ok */ }

        prontoParaTrocar = true;
        btn.disabled = false;
        btn.textContent = 'Salvar nova senha';
      }

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        if (!prontoParaTrocar) {
          mostrarAviso('Aguarde a validação do link…', 'info');
          return;
        }
        var s1 = document.getElementById('senha').value;
        var s2 = document.getElementById('senha2').value;
        if (s1 !== s2) {
          mostrarAviso('As senhas não conferem.', 'erro');
          return;
        }
        if (s1.length < 8) {
          mostrarAviso('A senha precisa ter pelo menos 8 caracteres.', 'erro');
          return;
        }
        btn.disabled = true;
        btn.textContent = 'Salvando…';
        try {
          var r = await window.abenfo.auth.atualizarSenha(s1);
          if (r.error) throw r.error;
          mostrarAviso('<strong>Senha atualizada!</strong> Redirecionando para a área da associada…', 'sucesso');
          form.style.display = 'none';
          setTimeout(function () { window.location.href = '/area'; }, 1500);
        } catch (err) {
          mostrarAviso(traduzErroSenha(err), 'erro');
          btn.disabled = false;
          btn.textContent = 'Salvar nova senha';
        }
      });

      // Traduz os erros mais comuns do Supabase para português amigável.
      function traduzErroSenha(err) {
        var m = (err && err.message) || '';
        var code = (err && err.code) || '';
        if (code === 'same_password' || /different from the old password/i.test(m)) {
          return 'A nova senha precisa ser <strong>diferente da senha atual</strong>. Escolha uma senha nova.';
        }
        if (code === 'weak_password' || /at least|should be at least|password.*(short|weak)/i.test(m)) {
          return 'A senha precisa ter pelo menos 8 caracteres. Tente uma senha um pouco maior.';
        }
        if (/session|not authenticated|jwt/i.test(m)) {
          return 'Sua sessão expirou. Abra novamente o link mais recente do seu e-mail.' +
            ' <a href="recuperar-senha.html">Pedir um novo link.</a>';
        }
        return 'Não foi possível atualizar a senha: ' + (m || 'tente novamente') + '.';
      }

      inicializar();
    })();
  </script>
</body>
</html>
